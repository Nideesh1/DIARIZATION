# "Who said what": cd demo && docker compose up -d --build   ->  http://localhost:8080
#
#   browser -> ui (NiceGUI) -> MinIO (audio) + Postgres (row: queued) -> Redis stream job
#           -> worker (FastStream) -> GPU ASR service -> MinIO (result.json) + Postgres (stats)
#           -> Redis pub/sub event -> ui pushes the new status to every open page
#   while recording: browser mic (16 kHz PCM) -> ui /ws/live proxy -> GPU streaming ASR (:9101)
#           -> live captions back over the same WebSockets
#
# Credentials below are DEV-ONLY defaults for a laptop demo. Postgres and Redis are not
# published at all; the ui and MinIO ports are bound to 127.0.0.1.
# ASR_URL / ASR_STREAM_URL / ASR_TOKEN come from demo/.env (env_file; never copied into the image).

x-app-env: &app-env
  DATABASE_URL: postgresql://demo:demo-dev-only@postgres:5432/demo
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000              # inside the compose network
  S3_PUBLIC_ENDPOINT: http://localhost:9000   # what the browser uses for presigned audio URLs
  S3_ACCESS_KEY: minio-dev-only
  S3_SECRET_KEY: minio-dev-only-secret
  S3_BUCKET: recordings
  TZ: ${TZ:-UTC}                              # set TZ=... in .env for local timestamps

x-app-deps: &app-deps
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }
  minio: { condition: service_healthy }
  minio-init: { condition: service_completed_successfully }

services:
  ui:
    build: .
    image: asr-demo
    command: ["python", "app.py"]
    ports:
      - "127.0.0.1:8080:8080"   # localhost only: mic access needs localhost; the app has no login
    env_file: .env              # ASR_URL, ASR_TOKEN (health), ASR_STREAM_URL (live-captions proxy + health)
    environment: *app-env
    depends_on: *app-deps
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build: .                    # same image as ui (the second build is all cache hits)
    image: asr-demo
    command: ["python", "worker.py"]
    env_file: .env              # ASR_URL, ASR_TOKEN
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: "2"   # jobs in flight; match the ASR service's MAX_JOBS
    depends_on: *app-deps
    stop_grace_period: 35s      # let in-flight jobs finish on stop/restart (broker graceful_timeout 30 s)
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo-dev-only
      POSTGRES_DB: demo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio-dev-only
      MINIO_ROOT_PASSWORD: minio-dev-only-secret
    ports:
      - "127.0.0.1:9000:9000"   # S3 API: the browser fetches audio here via presigned URLs
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:                   # one-shot: create the bucket, then exit
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 minio-dev-only minio-dev-only-secret && mc mb --ignore-existing local/recordings"]

volumes:
  postgres-data:
  minio-data:
